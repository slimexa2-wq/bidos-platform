      # 「市场准入评估机制」这类假项目并渲染到竞对分析页。
      "未中标项目": 该 Sheet 实为竞对复盘/战略分析表（实测 17 行全为分析文本，非项目清单），已停用导入
    fields:
      序号:                 {target: meta.row_serial, kind: fact, status: confirmed}
      年份:                 {target: meta.year, kind: fact, status: confirmed}
      月份:                 {target: meta.month, kind: fact, status: confirmed}
      所属公司:             {target: entities.company, kind: fact, entity: company, status: 待业务确认}  # 值为「重庆/保安/市场/双流/郫都/龙泉/宜宾/广元」，是业务片区而非公司主体
      项目类型:             {target: meta.business_category, kind: fact, status: 待业务确认}  # 2025年/2026年 里是「企业/机关/保安」
      项目类型_2:           {target: meta.procurement_method, kind: fact, status: 待业务确认}  # 同名重复列，值是「公开/询价/竞标/比选/谈判/磋商」
      项目情况:             {target: meta.project_scenario, kind: human, status: confirmed}
      开标时间:             {target: meta.open_bid_at, kind: fact, status: confirmed}   # 裸 Excel 序列号，必须转 datetime
      项目名称:             {target: projects.name, kind: fact, required: true, status: confirmed}
      甲方名称:             {target: projects.client_name, kind: fact, entity: client, status: confirmed}
      代理机构:             {target: entities.agency, kind: fact, entity: agency, status: confirmed}
      参与单位:             {target: meta.participating_entity, kind: fact, status: 待业务确认}  # 值含「未参与」，不是纯实体列；是否建实体需业务确认
      报名费（元）:         {target: meta.registration_fee, kind: fact, status: confirmed}
      打印费（元）:         {target: meta.print_fee, kind: fact, status: confirmed}
      资料份数:             {target: meta.bid_doc_copies, kind: fact, status: confirmed}
      是否中标:             {target: results.result, kind: fact, status: confirmed}
      是否踏勘:             {target: meta.survey_required, kind: fact, status: confirmed}
      中标单位:             {target: results.winner, kind: fact, status: confirmed}
      限价:                 {target: projects.budget, kind: fact, status: 待业务确认}
      限价(万元):           {target: projects.budget, kind: fact, status: 待业务确认}
      限价（万元）:         {target: projects.budget, kind: fact, status: 待业务确认}
      中标价格:             {target: results.winning_price, kind: fact, status: 待业务确认}
      中标金额（万元）:     {target: results.winning_price, kind: fact, status: 待业务确认}  # 单位混乱
      中标金额:             {target: results.winning_price, kind: fact, status: 待业务确认}
      折扣率:               {target: results.discount_rate, kind: fact, status: confirmed}
      报价类型:             {target: meta.quote_type, kind: fact, status: confirmed}
      人数:                 {target: meta.headcount, kind: fact, status: confirmed}
      管理费（元/人/月）:   {target: meta.management_fee, kind: fact, status: confirmed}
      单人管理费（元/人/月）: {target: meta.management_fee, kind: fact, status: confirmed}
      预估总价（万元）:     {target: meta.estimated_total, kind: fact, status: confirmed}
      # ── 保证金（Phase 1 优先级：保证金台账；bid_bond_ledger 的唯一真实来源）──
      投标保证金（元）:     {target: bonds.amount, kind: fact, status: confirmed}   # 真值含「5760*3」这类算式，解析不出金额时按 0 占位并标 amount_missing
      履约保证金（万元）:   {target: meta.performance_bond, kind: fact, status: confirmed}  # 履约保证金 ≠ 投标保证金，不进 bid_bond_ledger
      退回情况:             {target: bonds.status, kind: fact, status: 待业务确认}   # 真值「已退回/已退回到账10.13/财务已确认缴纳」，带日期的信息会丢，需业务确认口径
      预计时间:             {target: meta.refund_expected_note, kind: fact, status: 待业务确认}  # 真值是「节前/节后」，不是日期，不能写 expected_refund_at
      跟进人:               {target: meta.follow_up_owner, kind: fact, status: confirmed}
      中标服务费（元）:     {target: meta.win_service_fee, kind: fact, status: confirmed}
      服务期限:             {target: projects.service_term_months, kind: fact, status: confirmed}
      标书负责情况:         {target: meta.book_owner, kind: fact, status: confirmed}
      系统录入:             {target: meta.system_entered, kind: fact, status: confirmed}
      盲投排名:             {target: meta.blind_bid_rank, kind: fact, status: confirmed}
      报价评分:             {target: meta.quote_score, kind: fact, status: confirmed}
      # ── 入库项目台账：项目结束日期（90 天到期提醒的唯一可靠来源）──
      合同签订时间:         {target: meta.contract_signed_at, kind: fact, status: 待业务确认}  # ⚠️ 不等于服务开始日期，未确认前**不参与**结束日期推算
      到期日期:             {target: projects.project_end_at, kind: fact, status: confirmed}  # 列名含「到期日」→ 判定为 exact（明确日期），不是 estimated
      # ── 未参与 / 未中标 专用 ──
      未参与原因:           {target: meta.not_participate_reason, kind: human, status: confirmed}
    # 同名列在不同 Sheet 语义不同：这两个 Sheet 只有一列「项目类型」，且值是采购方式
    sheet_fields:
      "2023年":
        项目类型: {target: meta.procurement_method, kind: fact, status: 待业务确认}
      "2024年":
        项目类型: {target: meta.procurement_method, kind: fact, status: 待业务确认}

# ─────────────────────────────────────────────────────────────
# 五、Source Pointer 规则（数据字典 ⑧ 项）
#     Excel 不支持 URL 精确跳单元格 → 只保存 Sheet + 行号 + 单元格范围 + 原文片段，
#     UI 显示定位文字，绝不伪造链接（FAILURE_MODES §4）。
# ─────────────────────────────────────────────────────────────
source_pointer:
  source_type: sheet
  trust_level: internal
  row_id_format: "{row}"                 # location_label 会渲染成「第N行/记录」
  cell_range_format: "{first_col}{row}:{last_col}{row}"
  content_hash_algo: sha256
  original_text_max_len: 800
  project_id_rule: "bidos_proj_<sha1(normalize(name)+'|'+normalize(client_name))[:16]>"
  entity_id_rule: "bidos_ent_<sha1(normalize(canonical_name)+'|'+entity_type)[:16]>"
  source_object_id_rule: "bidos_src_<sha1(source_id+'|'+external_id)[:16]>"
  pointer_id_rule: "bidos_ptr_<sha1(source_object_id+'|'+sheet_name+'|'+row)[:16]>"

# ─────────────────────────────────────────────────────────────
# 六、日期 / 金额 / 服务期限解析规则（确定性规则，不用 LLM 算日期）
# ─────────────────────────────────────────────────────────────
parsing:
  date_formats: ["%Y-%m-%d", "%Y/%m/%d", "%Y.%m.%d", "%Y年%m月%d日", "%Y-%m-%d %H:%M", "%Y/%m/%d %H:%M"]
  money_units:
    元: 1
    万元: 10000
    万: 10000
    亿元: 100000000
    亿: 100000000
  duration_units:
    年: 12
    个月: 1
    月: 1
    天: 0.0333
  # 仅当「服务期限 + 已确认开始日期」同时存在时才推算结束日期，且 kind=estimated
  end_date_kind_rules:
    explicit_contract_or_award_date: exact
    service_term_plus_confirmed_start: estimated
    manual_entry: manual
